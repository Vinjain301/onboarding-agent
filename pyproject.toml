[project]
name = "onboarding-agent"
version = "1.0.0"
description = "RAG-based new hire onboarding assistant with a mock Workday integration"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E, F: standard pyflakes/pycodestyle correctness checks.
# I: import sorting, kept consistent without a separate isort dependency.
# B: bugbear, catches common correctness pitfalls (mutable defaults, etc.).
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
